name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest numba ruff

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Unit tests
        working-directory: backend
        run: pytest tests -q --ignore=tests/test_e2e_ui.py

      - name: Frontend test
        working-directory: backend
        run: node --test tests/test_telemetry_csv.cjs

  full-mission:
    # ~75 s end-to-end regression of the nominal mission outcome.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest numba

      - name: Full-mission regression
        working-directory: backend
        run: pytest tests -m slow -q
